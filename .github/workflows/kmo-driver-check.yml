name: KMO Driver - Verificacao

on:
  push:
    branches: [main]
    paths:
      - 'kmo-driver/**'
      - '.github/workflows/kmo-driver-check.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Validar JavaScript
        run: node --check kmo-driver/app.js

      - name: Validar manifest PWA
        run: python -m json.tool kmo-driver/manifest.json > /dev/null

      - name: Verificar arquivos públicos
        run: |
          test -f kmo-driver/index.html
          test -f kmo-driver/styles.css
          test -f kmo-driver/app.js
          test -f kmo-driver/sw.js
          grep -q 'KMO Driver' kmo-driver/index.html

      - name: Teste HTTP local
        run: |
          python -m http.server 8000 --directory . >/tmp/kmo-pages.log 2>&1 &
          PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8000/kmo-driver/ | grep -q 'KMO Driver'
          curl -fsS http://127.0.0.1:8000/kmo-driver/app.js > /dev/null
          kill $PID || true
